<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Acceso privado | Camelia Books</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/admin-login.js" defer></script>
  </head>
  <body class="pagina-admin">
    <main class="admin-acceso">
      <section class="admin-panel admin-panel-acceso">
        <a class="marca-admin" href="../index.html">🌸 Camelia Books</a>
        <p class="intro-etiqueta">Área privada</p>
        <h1>Acceso de administradora</h1>
        <p>Inicia sesión para gestionar el catálogo de libros.</p>

        <form id="form-login" class="form-admin">
          <label for="email-admin">Correo electrónico</label>
          <input id="email-admin" type="email" autocomplete="email" required />

          <label for="password-admin">Contraseña</label>
          <input
            id="password-admin"
            type="password"
            autocomplete="current-password"
            required
          />

          <button class="boton-principal" type="submit">Entrar</button>
          <p id="estado-login" class="estado-formulario" aria-live="polite"></p>
        </form>

        <a class="volver" href="../index.html">← Volver a la web</a>
      </section>
    </main>
  </body>
</html>
